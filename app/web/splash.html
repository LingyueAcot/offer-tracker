<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>应届海投管理</title>
<style>
  /*
   * 启动画面：窗口先显示这一页，等后台服务起来之后再切到真实页面。
   * 有了它就不会出现「双击之后先白屏几秒」那种感觉。
   *
   * 色值刻意和主界面 index.html 的 :root 变量保持一致：
   *   --bg #f4f5fa / 深色 #0e1016 / 文字 #1b2333 / 强调色 #4f46e5
   * 改主界面的主题色时，这里跟着改一下。
   */
  :root{
    --bg:#f4f5fa; --text:#1b2333; --muted:#6b7488; --accent:#4f46e5;
    --line:#e4e6ef; --track:#e4e6ef;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1016; --text:#e7e9f0; --muted:#98a1b3; --accent:#8b83ff;
      --line:#282d3a; --track:#282d3a;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased; user-select:none;
  }
  main{display:flex; flex-direction:column; align-items:center; gap:14px; padding:32px}
  .logo{font-size:52px; line-height:1}
  h1{margin:0; font-size:21px; font-weight:700; letter-spacing:.3px}
  .status{margin:0; color:var(--muted); font-size:13px; min-height:18px}
  .bar{width:180px; height:3px; border-radius:2px; background:var(--track); overflow:hidden}
  .bar i{
    display:block; width:40%; height:100%; border-radius:2px; background:var(--accent);
    animation:slide 1.15s ease-in-out infinite;
  }
  @keyframes slide{
    0%{transform:translateX(-100%)}
    100%{transform:translateX(250%)}
  }
  .hint{margin-top:6px; color:var(--muted); font-size:11.5px}
  @media (prefers-reduced-motion: reduce){
    .bar i{animation:none; width:100%}
  }
</style>
</head>
<body>
<main>
  <div class="logo">📮</div>
  <h1>应届海投管理</h1>
  <p class="status" id="status">正在启动…</p>
  <div class="bar"><i></i></div>
  <p class="hint" id="hint">第一次打开可能要等几秒</p>
</main>
<script>
  // 等得久了给一句更具体的话，免得用户以为卡死了
  setTimeout(function () {
    var status = document.getElementById("status");
    if (status) status.textContent = "还在启动，请稍候…";
  }, 4000);
  setTimeout(function () {
    var hint = document.getElementById("hint");
    if (hint) hint.textContent = "如果一直停在这里，看 logs\\launcher.log 里的原因";
  }, 12000);
</script>
</body>
</html>
